[build]
  base = "client"
  command = "npm run build"
  publish = "dist"
  # Exit 1 tells Netlify to run the build instead of skipping it as unchanged.
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "22.23.5"
  VITE_DEV_SERVER = "https://nlog-blog.onrender.com"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://nlog-blog.onrender.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
